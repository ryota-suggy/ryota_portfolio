<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Ryota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="about-page">

<header class="site-nav is-solid" id="site-nav">
  <a class="brand" href="index.html">Ryota</a>
  <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-right">
    <nav class="nav-links" id="nav-links">
      <a href="index.html#reels">Reels</a>
      <a href="index.html#stills">Stills</a>
      <a href="index.html#articles">Articles</a>
      <a href="about.html" class="is-active">About</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="ダーク/ライト表示を切り替え" type="button">
      <span id="theme-toggle-icon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>

<main class="about-main">
  <section class="about-hero">
    <p class="about-eyebrow" id="about-role"></p>
    <h1 id="about-name"></h1>
    <p class="about-statement" id="about-statement"></p>
  </section>

  <section class="about-body">
    <div class="about-bio">
      <img class="about-photo" id="about-photo" alt="" hidden>
      <div id="about-bio-text"></div>
    </div>

    <div class="about-contact">
      <h2>Contact</h2>
      <button class="email-copy" id="email-copy" type="button">
        <span id="email-text"></span>
        <span class="email-copy-flag" id="email-copy-flag">クリックしてコピー</span>
      </button>

      <ul class="social-links" id="social-links"></ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span>&copy; <span id="year"></span> Ryota Sugisaki</span>
  <a href="index.html">Back to Work</a>
</footer>

<script src="js/works.js"></script>
<script src="js/about.js"></script>
