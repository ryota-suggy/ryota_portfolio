<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryota — Portfolio</title>
<meta name="description" content="Director of Photography / Visual Artist portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-nav" id="site-nav">
  <a class="brand" href="#top">Ryota</a>
  <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-right">
    <nav class="nav-links" id="nav-links">
      <a href="#reels" data-cat="REELS">Reels</a>
      <a href="#stills" data-cat="STILLS">Stills</a>
      <a href="#articles" data-cat="ARTICLES">Articles</a>
      <a href="about.html">About</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="ダーク/ライト表示を切り替え" type="button">
      <span id="theme-toggle-icon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>

<main>

  <section class="hero" id="top">
    <div class="hero-video-stage" id="hero-video-stage"></div>
    <div class="hero-veil"></div>
    <div class="hero-content">
      <h1 id="hero-name">Ryota</h1>
      <p class="hero-sub" id="hero-role">Director of Photography / Visual Artist</p>
    </div>
    <a class="scroll-cue" href="#reels" aria-label="下にスクロール">
      <span></span>
    </a>
  </section>

  <section class="works-section" id="reels">
    <div class="section-head">
      <h2>Reels</h2>
      <span class="section-count" data-count="REELS"></span>
    </div>
    <div class="works-grid" id="grid-reels" data-category="REELS"></div>
  </section>

  <section class="works-section" id="stills">
    <div class="section-head">
      <h2>Stills</h2>
      <span class="section-count" data-count="STILLS"></span>
    </div>
    <div class="works-grid works-grid--stills" id="grid-stills" data-category="STILLS"></div>
  </section>

  <section class="works-section" id="articles">
    <div class="section-head">
      <h2>Articles</h2>
      <span class="section-count" data-count="ARTICLES"></span>
    </div>
    <div class="works-grid works-grid--articles" id="grid-articles" data-category="ARTICLES"></div>
  </section>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Ryota Sugisaki</span>
    <a href="about.html">About &amp; Contact</a>
  </footer>

</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="閉じる">&times;</button>
  <div class="lightbox-body" id="lightbox-body"></div>
</div>

<script src="js/works.js"></script>
<script src="js/main.js"></script>
</body>
</html>
