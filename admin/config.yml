backend:
  name: github
  repo: ryota-suggy/ryota_portfolio
  branch: main

# Sveltia CMSがGitHubに直接コミットします(Netlifyは不要)。
# ログインには自分のGitHub個人アクセストークン(Fine-grained PAT)を使います。
# セットアップ手順は README.md の「Sveltia CMSで管理画面を使う」を参照。

media_folder: "assets/images/uploads"
public_folder: "/ryota_portfolio/assets/images/uploads"

collections:
  - name: "site_data"
    label: "サイトデータ"
    files:
      - file: "data/works.json"
        label: "作品・About情報"
        name: "site_data"
        fields:
          - label: "ヒーロー動画"
            name: "hero"
            widget: "object"
            fields:
              - label: "動画(mp4)一覧 — 上から順に自動再生されます"
                name: "videos"
                widget: "list"
                field: { label: "動画パス/URL", name: "video", widget: "string" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "名前", name: "name", widget: "string" }
              - { label: "肩書き", name: "role", widget: "string" }
              - { label: "一言ステートメント", name: "statement", widget: "text" }
              - label: "経歴・自己紹介(段落ごとに追加)"
                name: "bio"
                widget: "list"
                field: { label: "段落", name: "paragraph", widget: "text" }
              - { label: "メールアドレス(クリックでコピーされます)", name: "email", widget: "string" }
              - { label: "プロフィール写真", name: "photo", widget: "image", required: false }
              - label: "SNS・外部リンク"
                name: "links"
                widget: "list"
                fields:
                  - { label: "表示名", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "REELS作品"
            name: "worksReels"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "タイトル(空欄でもYouTube/Vimeoは自動取得を試みます。ArtStationは必須)"
                name: "title"
                widget: "string"
                required: false
              - label: "種類"
                name: "platform"
                widget: "select"
                default: "youtube"
                options:
                  - { label: "YouTube", value: "youtube" }
                  - { label: "Vimeo", value: "vimeo" }
                  - { label: "ArtStation / 画像", value: "artstation" }
              - label: "元のページURL(任意。YouTube/Vimeo/ArtStationなど)"
                name: "sourceUrl"
                widget: "string"
                required: false
              - label: "サムネイル画像(空欄ならYouTube/Vimeoから自動取得。ArtStationは必須)"
                name: "thumbnail"
                widget: "image"
                required: false
              - label: "説明文(任意)"
                name: "description"
                widget: "text"
                required: false
              - label: "追加日"
                name: "addedAt"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                default: ""

          - label: "STILLS作品"
            name: "worksStills"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "タイトル", name: "title", widget: "string" }
              - label: "種類"
                name: "platform"
                widget: "select"
                default: "artstation"
                options:
                  - { label: "ArtStation / 画像", value: "artstation" }
              - label: "元のページURL(任意。ArtStationの作品ページなど)"
                name: "sourceUrl"
                widget: "string"
                required: false
              - { label: "サムネイル画像", name: "thumbnail", widget: "image" }
              - label: "説明文(任意)"
                name: "description"
                widget: "text"
                required: false
              - label: "追加日"
                name: "addedAt"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                default: ""

          - label: "Articles(記事紹介)"
            name: "worksArticles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "タイトル(空欄なら記事のURLから自動取得を試みます)"
                name: "title"
                widget: "string"
                required: false
              - label: "記事のURL(note、CGWORLDなど)"
                name: "sourceUrl"
                widget: "string"
              - label: "サムネイル画像(空欄なら記事のURLから自動取得を試みます)"
                name: "thumbnail"
                widget: "image"
                required: false
              - label: "追加日"
                name: "addedAt"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                default: ""
